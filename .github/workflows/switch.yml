---
name: Nintendo Switch

on:  # yamllint disable-line rule:truthy
  # [RUNS MOD] Fork CI is restricted to releases + manual runs only; we build
  # locally, so we do not run the full matrix on every push.
  release:
    types: [published]
  workflow_dispatch:
# [RUNS MOD] Allow the release-upload step to attach the .nro to the release.
permissions:
  contents: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure CMake
        run: |
          cmake \
            -S . \
            -B build \
            -D CMAKE_BUILD_TYPE=RelWithDebInfo \
            -D CMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake

      - name: Build DevilutionX
        run: cmake --build build -j$(nproc)

      # [RUNS MOD] The Hellfire expansion is a data mod, not a build flag: the engine looks
      # for <BasePath>/mods/Hellfire/, and on Switch BasePath is the folder holding the
      # .nro. That data is built to build/mods but is NOT inside the .nro romfs, so the
      # .nro alone can never enable Hellfire no matter which MPQs the user copies over.
      # Ship it beside the .nro instead.
      - name: Stage release package
        run: |
          mkdir -p package
          cp ./build/devilutionx.nro package/
          cp -r ./build/mods package/mods
          cd package && zip -r ../devilutionx-switch.zip .

      - name: Upload Package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v7
        with:
          name: devilutionx-switch
          path: ./devilutionx-switch.zip

      - name: Update Release
        if: ${{ github.event_name == 'release' && !env.ACT }}
        uses: svenstaro/upload-release-action@v2
        with:
          asset_name: devilutionx-switch.zip
          file: ./devilutionx-switch.zip
          overwrite: true
...
